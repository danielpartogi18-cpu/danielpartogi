name = "ruangawan-api"
main = "worker/src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ruangawan-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "worker/migrations"

[[r2_buckets]]
binding = "RUANGAWAN_FILES"
bucket_name = "ruangawan-files"

[vars]
APP_ORIGIN = "https://ruangawan-cloud.vercel.app"
